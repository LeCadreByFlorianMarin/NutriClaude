name: CI

on:
  push:
    branches: [main]
  pull_request:

# Une seule exécution par branche. L'annulation ne vaut QUE pour les pull
# requests : sur `main`, deux merges rapprochés feraient annuler le run du
# premier commit par le second, et un run annulé se rapporte comme neutre — pas
# comme échoué. Le commit atterrirait sur la branche déployée sans avoir jamais
# terminé sa vérification.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Source unique de la CI. Épingler un numéro ici ferait valider un
          # runtime que personne n'exécute — et `node --test` a besoin de
          # l'exécution native de TypeScript, absente avant Node 23.6.
          #
          # ⚠️ Ce fichier et `engines.node` de `package.json` doivent nommer la
          # MÊME version majeure. C'est `engines.node` que Vercel arbitre, pas
          # ce fichier : mesuré le 2026-07-29, `>=25.0.0` a fait échouer le
          # déploiement (« Found invalid or discontinued Node.js Version »),
          # alors que ce fichier disait déjà 25 depuis le squelette sans que
          # rien ne le lise. Vercel plafonne à 24.x.
          #
          # `engines` est épinglé — `24.x`, pas `>=24.0.0`. Un intervalle ouvert
          # ferait monter Vercel seul à la sortie de Node 25 (il l'avertit
          # explicitement au build), pendant que ce fichier resterait en 24 : la
          # CI validerait de nouveau un runtime que la production n'exécute pas,
          # en silence et sans build rouge. Monter de majeure est donc un commit
          # délibéré qui touche les DEUX fichiers, avec le déploiement de la PR
          # pour témoin.
          node-version-file: .node-version
          cache: npm

      # `npm ci` échoue si package-lock.json et package.json divergent, et
      # installe exactement les versions verrouillées. Il ne contrôle PAS le
      # respect d'AR-STACK : une montée de `next` faite dans les deux fichiers
      # passerait sans broncher. Ce contrôle-là reste humain, en revue.
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Sans réseau ni base : uniquement les prédicats purs dont dépend le
      # contrôle d'accès. Aucune dépendance ajoutée — `node --test` est dans le
      # runtime (NFR-10).
      - name: Test
        run: npm test

      # Le build a besoin des variables Supabase pour instancier le client.
      # Valeurs factices : rien n'appelle le réseau à la compilation.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key

  # ── L'isolation entre foyers (NFR-5), prouvée par exécution ──────────────
  #
  # ⚠️ Job SÉPARÉ de `verify`, et c'est délibéré : il monte un stack Postgres
  # complet, donc il est lent et il peut être instable de son propre chef. Le
  # mêler à `verify` ferait retomber le typecheck sur une panne de conteneur.
  #
  # POURQUOI IL EXISTE. Jusqu'au 2026-07-29, `npm run test:isolation` ne tournait
  # dans aucun automate : le glob de `npm test` s'arrête à `lib/`, et rien
  # d'autre ne lançait `supabase/tests/`. Les tests qui prouvent la garde de
  # `seed_default_aisles` — le trou d'écriture inter-foyers refermé par la story
  # 2.1 — n'existaient donc que pour qui pensait à lancer `npx supabase start`
  # sur son poste. AD-17 dit « l'isolation se prouve par un test exécuté, pas par
  # une lecture » ; sans ce job, c'était une déclaration.
  #
  # `stack-local.ts` LÈVE si le stack est absent, au lieu de passer en silence.
  # C'est ce qui rend ce job honnête : il ne peut pas devenir vert en n'ayant
  # rien vérifié.
  isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      # Version épinglée, et la MÊME que `scripts/migrer-au-deploiement.mjs`.
      # Deux numéros qui divergent feraient valider la chaîne de migrations par
      # une CLI que la production n'emploie pas.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.110.0

      # `db reset` est implicite au démarrage : les migrations sont rejouées
      # depuis zéro. C'est le seul endroit de la chaîne où elles s'exécutent
      # avant la production.
      - name: Démarrer le stack local
        run: supabase start

      - name: Tests d'isolation
        run: npm run test:isolation

      # Sans `if: always()`, un test rouge laisserait les conteneurs debout et
      # le runner serait recyclé sans les arrêter — sans conséquence ici, mais
      # la sortie de `stop` dit parfois pourquoi un test a échoué.
      - name: Arrêter le stack local
        if: always()
        run: supabase stop
