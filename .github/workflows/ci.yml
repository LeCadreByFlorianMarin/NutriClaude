name: CI

on:
  push:
    branches: [main]
  pull_request:

# Une seule exécution par branche : un nouveau push annule la précédente.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Plancher imposé par @supabase/supabase-js (engines: node >=22).
          node-version: 22
          cache: npm

      # `npm ci` échoue si package-lock.json et package.json divergent :
      # c'est aussi la garantie que les versions d'AR-STACK sont respectées.
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Le build a besoin des variables Supabase pour instancier le client.
      # Valeurs factices : rien n'appelle le réseau à la compilation.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
